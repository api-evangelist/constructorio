source: mcp/constructorio-mcp.yml + openapi/*.yml
summary: >-
  Constructor's published MCP server is a DOCUMENTATION server, not a projection of
  the product REST API. Its six tools operate over the OpenAPI documents and doc
  pages themselves (list-specs / list-endpoints / get-endpoint / search-endpoints /
  search / fetch), so not one MCP tool maps to a Constructor product operationId.
  The honest crosswalk is therefore: zero bound tools, six meta tools, and all 180
  REST operations unexposed to agents via MCP. This is a real and material surface
  divergence — an agent connected to Constructor's MCP server can read about the
  Search API but cannot call it — and is recorded rather than papered over.
