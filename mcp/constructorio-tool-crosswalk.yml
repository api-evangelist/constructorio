      batching.catalog.cnstrc.com, retail.media-cnstrc.com, display.media-cnstrc.com]
    gated: false
    note: specs are published through the ReadMe-hosted docs at docs.constructor.com
      and are harvested verbatim in openapi/
  graphql:
    endpoint: null
    note: Constructor publishes no GraphQL surface
  mcp:
