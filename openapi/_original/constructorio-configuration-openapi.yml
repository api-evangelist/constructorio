components:
  schemas:
    CollectionGetResponse:
      title: CollectionGetResponse
      type: object
      properties:
        id:
          title: ID
          description: ID of the collection.
          minLength: 1
          maxLength: 100
          type: string
        display_name:
          title: Display Name
          description: Name of the collection to be displayed to end users.
          examples:
          - Summer Sale
          - Halloween Baking Mixes
          minLength: 1
          maxLength: 100
          type: string
        filter_expression:
          title: Filter expression
          description: '[Filter expression](/reference/shared-filter-expressions) associated with this collection.'
          examples:
          - name: brand
            value: Nike
          - and:
            - name: price
              range:
              - 10
              - 100
            - name: color
              value: red
          allOf:
          - $ref: '#/components/schemas/DictOrJsonStringWithDict'
        data:
          title: Data
          description: 'Object containing additional data, that should be attached to this collection. The maximum size of data object is limited to 200kb. '
          examples:
          - key: value
          - promo_code: SUMMER20
          type: object
        discoverable:
          title: Discoverable
          description: When true, the collection is discoverable in autocomplete and search.
          default: false
          examples:
          - false
          - true
          type: boolean
        matches:
          title: Matches
          description: A list of terms associated with this collection for matching purposes.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/CollectionMatchResponse'
        start_time:
          title: Start Time
          description: ISO-8601 string in UTC defining start time when the collection becomes active. Any specified timezone will be omitted.
          type: string
          format: date-time
        end_time:
          title: End Time
          description: ISO-8601 string in UTC defining start time when the collection becomes inactive. Any specified timezone will be omitted.
