    SearchabilityGetResponse:
      title: SearchabilityGetResponse
      type: object
      properties:
        name:
          title: Name
          description: Name of searchability field.
          maxLength: 300
          minLength: 1
          type: string
        percentage_presence:
          title: Percentage presence
          description: Percentage of items and variations that contain this field.
          minimum: 0
          maximum: 100
          type: number
        fuzzy_searchable:
          title: Fuzzy Searchable
          description: Configure a field as fuzzy-searchable to enable typo-tolerant keyword-matching on field values in search and autocomplete. A field can be fuzzy-searchable or exact-searchable, but not both. Avoid marking very verbose fields (e.g. long descriptions) as fuzzy-searchable, since it can lead to recall of more items than is necessary and introduces complexity with ranking.
          type: boolean
        facetable:
          title: Facetable
          description: Specifies whether the field should be treated as a facet. When True, the metadata field must be a string, float, integer, or list of these types. Dictionaries are supported if they contain values of these types. Nested dictionaries are not supported
          type: boolean
        exact_searchable:
          title: Exact Searchable
          description: Configure this field for ID or ID-like values (SKU ID, ISBN, part number, etc.) to enable exact matching only, with no typo-tolerance, for search and autocomplete. Do not use for fields containing natural language words. A field can be exact-searchable or fuzzy-searchable, but not both.
          type: boolean
        type:
          title: Type
          allOf:
          - $ref: '#/components/schemas/MetadataSearchabilityType'
        example_items:
          title: Example Items
          description: A list of items that has this searchability field.
          type: array
          items:
            type: string
        default:
          title: Default
          description: Flag that shows if this searchability config is default.
          type: boolean
        displayable:
          title: Displayable
          description: Specifies whether the field is displayable in the response within the `results` array.
          type: boolean
        hidden:
          title: Hidden
          description: Hides the field by default in the response but makes it available to retrieve via `fmt_options[hidden_fields]` parameter.
          type: boolean
        created_at:
          title: Created At
          description: Creation date and time
          type: string
          format: date-time
        updated_at:
          title: Updated At
          description: Last updated date and time
          type: string
          format: date-time
