          title: Display Name
          description: The name of the facet to present to end users. Default value is `null`, in which case the `name` will be presented.
          maxLength: 200
          examples:
          - Brand Name
          - Size
          type: string
        sort_order:
          description: Determines the default criterion by which options of this facet group are sorted. Must be one of `relevance`, `value` (to sort facet options alphanumerically), `num_matches` (to sort facet options by number of matching results). Default value is `relevance`. Sort can be overridden by setting the `position` attribute on facet options.
          examples:
          - relevance
          - value
          - num_matches
          allOf:
          - $ref: '#/components/schemas/FacetOptionSortOrder'
        sort_descending:
          title: Sort Descending
          description: '`true` if this facet group''s options should be sorted in descending order, `false` to sort ascending. Default value is `true` if `sort_order` is `relevance` or `num_matches` and `false` for `value`. Setting `sort_order: relevance` will set `sort_descending: true` for `POST`, `PUT`, `PATCH` endpoints if `sort_descending` is not explicitly set in the request.'
          examples:
          - true
          - false
          type: boolean
        range_type:
          description: Should be `static` if a facet is configured as `range`. If the facet is not configured as a range, value will be `null`. Default value is null.
          examples:
          - static
          allOf:
