      additionalProperties: false
    FacetV2DeleteResponse:
      title: FacetV2DeleteResponse
      type: object
      properties:
        name:
          title: Name
          description: The facet name used to refer to the facet in your catalog. Must be unique inside the section and key.
          maxLength: 100
          minLength: 1
          examples:
          - Brand
          - Color
          type: string
        path_in_metadata:
          title: Path In Metadata
          description: The path in metadata of each item where this facet is present. Must be unique inside the section and key.
          maxLength: 300
          minLength: 1
          examples:
          - data.brand
          - data.attributes.color
          type: string
        type:
          description: Type of facet. Use `multiple` to display the facet as categorical values (for example, a Brand facet with values of Under Armour, Adidas and Puma) and `range` to display as a numeric range. You must use `range` when you want to display a slider, as well as when you want to display a list of range buckets.
          examples:
          - multiple
          - range
          allOf:
          - $ref: '#/components/schemas/FacetType'
        display_name:
          title: Display Name
          description: The name of the facet to present to end users. Default value is `null`, in which case the `name` will be presented.
          maxLength: 200
          examples:
          - Brand Name
          - Size
          type: string
        sort_order:
          description: Determines the default criterion by which options of this facet group are sorted. Must be one of `relevance`, `value` (to sort facet options alphanumerically), `num_matches` (to sort facet options by number of matching results). Default value is `relevance`. Sort can be overridden by setting the `position` attribute on facet options.
          examples:
          - relevance
          - value
          - num_matches
          allOf:
          - $ref: '#/components/schemas/FacetOptionSortOrder'
        sort_descending:
          title: Sort Descending
          description: '`true` if this facet group''s options should be sorted in descending order, `false` to sort ascending. Default value is `true` if `sort_order` is `relevance` or `num_matches` and `false` for `value`. Setting `sort_order: relevance` will set `sort_descending: true` for `POST`, `PUT`, `PATCH` endpoints if `sort_descending` is not explicitly set in the request.'
          examples:
          - true
          - false
          type: boolean
        range_type:
          description: Should be `static` if a facet is configured as `range`. If the facet is not configured as a range, value will be `null`. Default value is null.
          examples:
          - static
          allOf:
          - $ref: '#/components/schemas/FacetRangeType'
        range_format:
          description: Format of `range` facets. Determines whether the facet is configured to display as a slider (in which case the search endpoint will return only min & max values) or as a list of buckets. `boundaries` for sliders, `options` for buckets. Default value is `null`.
          examples:
          - boundaries
          - options
          allOf:
          - $ref: '#/components/schemas/FacetRangeFormat'
        range_inclusive:
          description: Used to create inclusive buckets. For example, for a `rating` facet, you might want to display options like `1 and above`, `2 and above`, `3 and above`, etc. Values can be either `above` (options have no upper bound), `below` (options have no lower bound), or `null` if range options should not be inclusive. Default value is `null`
          examples:
          - above
          - below
          allOf:
          - $ref: '#/components/schemas/FacetRangeInclusionType'
        range_limits:
          title: Range Limits
          description: Defines the cut-off points for generating static range buckets. Expects list of sorted numbers (like `[10, 25, 40]`). Default value is `null`
          minItems: 1
          maxItems: 24
          type: array
          items:
            anyOf:
            - type: integer
            - type: number
            examples:
            - 10
            - 25
            - 40
        match_type:
          description: 'Match types specify the behavior of filters when multiple options of the same facet (e.g: color: yellow & blue) are selected. Specifies whether the results must match all options, any of them or none.'
          examples:
          - any
          - all
          - none
          allOf:
          - $ref: '#/components/schemas/FilterMatchType'
        position:
          title: Position
          description: Used to slot facet groups to fixed positions. Must be >= 1. Default value is `null`.
          examples:
          - 1
          - 5
          type: integer
        hidden:
          title: Hidden
          description: Specifies whether the facet is hidden from users. Use this for facet data that you don't want shown to end users, but that isn't sensitive.
          examples:
          - false
          - true
          type: boolean
        protected:
          title: Protected
          description: Specifies whether the facet is protected from users. Setting this to `true` will require authentication to view the facet.
          examples:
          - false
          - true
          type: boolean
        countable:
          title: Countable
          description: Specifies whether counts for each facet option should be calculated and shown in the response. Setting this to `false` will skip counting these options, improving performance for facets with high cardinality.
          examples:
          - true
          - false
          type: boolean
        options_limit:
          title: Options Limit
          description: Maximum number of options of facet type `multiple` to return in search responses. If absent, the default limit is applied.
          minimum: 0
          maximum: 4000
          type: integer
          default: 500
        data:
          title: Data
          description: Dictionary with any extra facet data. Default value is `{}` (empty dictionary).
          examples:
          - key: value
          - config_key: config_value
          type: object
        created_at:
          title: Created At
          description: Facet creation date and time in ISO 8601 format
          type: string
          format: date-time
        updated_at:
          title: Updated At
          description: Last facet update date and time in ISO 8601 format.
          type: string
          format: date-time
      required:
      - created_at
      additionalProperties: false
