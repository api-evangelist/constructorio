          description: Maximum number of options of facet type `multiple` to return in search responses. If absent, the default limit is applied.
          minimum: 0
          maximum: 4000
          type: integer
          default: 500
        data:
          title: Data
          description: Dictionary with any extra facet data. Default value is `{}` (empty dictionary).
          examples:
          - key: value
          - config_key: config_value
          type: object
        created_at:
          title: Created At
          description: Facet creation date and time in ISO 8601 format
          type: string
          format: date-time
