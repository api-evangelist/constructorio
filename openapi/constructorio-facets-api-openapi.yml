          - data.attributes.color
          type: string
        type:
          description: Type of facet. Use `multiple` to display the facet as categorical values (for example, a Brand facet with values of Under Armour, Adidas and Puma) and `range` to display as a numeric range. You must use `range` when you want to display a slider, as well as when you want to display a list of range buckets.
          examples:
          - multiple
          - range
          allOf:
          - $ref: '#/components/schemas/FacetType'
        display_name:
          title: Display Name
          description: The name of the facet to present to end users. Default value is `null`, in which case the `name` will be presented.
          maxLength: 200
          examples:
          - Brand Name
          - Size
          type: string
