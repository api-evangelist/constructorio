          maxLength: 200
          examples:
          - Red
          - Blue
          type: string
        value_alias:
          title: Value Alias
          description: A value alias. It is used to merge several different but semantically similar facet options into one. For example, 'dark blue' and 'light blue' can be aliased to 'blue'.
