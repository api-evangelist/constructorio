          minLength: 1
          maxLength: 200
          type: string
        sort_order:
          description: The order the results will be sorted in
          examples:
          - ascending
          - descending
          allOf:
          - $ref: '#/components/schemas/SortOrderType'
      required:
      - display_name
      - path_in_metadata
      - sort_by
      - sort_order
    SortOptionListPutResponse:
