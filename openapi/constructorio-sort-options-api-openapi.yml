      properties:
        display_name:
          title: Display Name
          description: The name of the sort option as it is displayed to end users.
          examples:
          - 'Price: Low to High'
          - Best Rating
          minLength: 1
          maxLength: 200
          type: string
        path_in_metadata:
          title: Path In Metadata
          description: The path in the item's metadata to the field that results will be sorted according to.
          examples:
          - data.price
          - data.rating
          maxLength: 200
          type: string
        position:
          title: Position
          description: The position of the sort option, used to provide sort options in a specific order.
          examples:
          - 1
          - 5
          type: integer
        hidden:
          title: Hidden
          description: Indicates if a sort option is hidden. This can be marked at `sort_by` level. A hidden sort option will be ignored in response by default.
          default: false
          examples:
          - false
          - true
          type: boolean
        sort_by:
          title: Sort By
          description: The name of the sort option.
          examples:
          - price
          - relevance
          - rating
          minLength: 1
          maxLength: 200
          type: string
        sort_order:
          description: The order the results will be sorted in
          examples:
          - ascending
          - descending
          allOf:
          - $ref: '#/components/schemas/SortOrderType'
      required:
      - display_name
      - path_in_metadata
      - sort_by
      - sort_order
    SortOptionListGetResponse:
      title: SortOptionListGetResponse
      type: object
      properties:
        total_count:
          title: Total Count
          minimum: 0
          type: integer
        sort_options:
          title: Sort Options
          type: array
          items:
