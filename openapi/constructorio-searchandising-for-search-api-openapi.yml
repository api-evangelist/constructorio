      - http_bearer_auth:
        - searchandising.refined_queries(w)
components:
  schemas:
    RefinedQueryPutBody:
      title: RefinedQueryPutBody
      type: object
      properties:
        slot_rules:
          title: Slot Rules
          description: The slotting rules attached to the refined query
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/SlotRuleBase'
        whitelist_rule:
          title: Whitelist Rule
          description: The whitelist rule attached to the refined query
          oneOf:
          - $ref: '#/components/schemas/WhitelistRuleBase'
          - type: 'null'
        blacklist_rules:
          title: Blacklist Rules
          description: The blacklist rules attached to the refined query
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/BlacklistRuleBase'
        boost_rules:
          title: Boost Rules
          description: The boost rules attached to the refined query. It is allowed to create maximum 50 manual and 50 automatic rules. The number of rules for each of the types includes both active and inactive rules
          type: array
          items:
            $ref: '#/components/schemas/BoostRuleBase'
        content_rules:
          title: Content Rules
          description: The content rules attached to the refined query
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/ContentRuleBase'
        variation_slicing_rule:
          title: Variation Slicing Rule
          description: The variation slicing rule attached to the refined query
          oneOf:
          - $ref: '#/components/schemas/VariationSlicingRuleBase'
          - type: 'null'
        filters_slot_rules:
          title: Filters Slot Rules
          description: The filters slot rules attached to the refined query
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/FiltersSlotRuleBase'
        face_out_variation_rules:
          title: Face Out Variation Rules
          description: The face out variation rules attached to the refined query
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/FaceOutVariationRuleBase'
        query:
          title: Query
          examples:
          - shoes
          - running sneakers
          minLength: 1
          maxLength: 100
          type: string
        allow_automatic_rules:
          title: Allow Automatic Rules
          description: Specifies whether to allow automatic creation of rules
          default: true
          type: boolean
        last_reviewed_at:
          title: Last Reviewed At
          description: The date of the last review
          examples:
          - '2024-03-06T16:05:19'
          type: string
          format: date-time
        last_reviewed_by:
          title: Last Reviewed By
          description: The user who last reviewed the refined query
          examples:
          - user@example.com
          type: string
        next_review_at:
          title: Next Review At
          description: The date of the next review
          examples:
          - '2024-04-06T16:05:19'
          type: string
          format: date-time
      required:
      - query
      additionalProperties: false
    SlotFacetRuleParameters:
      title: SlotFacetRuleParameters
      type: object
      properties:
        name:
          title: Name
          description: The name of the facet to place in position.
          examples:
          - Brand
          - Color
          type: string
        position:
          title: Position
          description: The position of facet to place in.
          minimum: 1
          examples:
          - 1
          - 5
          type: integer
      required:
      - name
      - position
      additionalProperties: false
    PositionRange:
      title: PositionRange
      type: object
      properties:
        start:
          title: Start
          description: The start position of the slot.
          minimum: 1
          examples:
          - 1
          - 5
          type: integer
        end:
          title: End
          description: The end position of the slot.
          minimum: 1
          examples:
          - 3
          - 10
          type: integer
      required:
      - start
      - end
      additionalProperties: false
    FacetRuleTarget:
      title: FacetRuleTarget
      enum:
      - facet_group
      - facet_option
      type: string
    RefinedQueryPatchResponse:
      title: RefinedQueryPatchResponse
      anyOf:
      - $ref: '#/components/schemas/RefinedQueryResultsResponse'
      - $ref: '#/components/schemas/RefinedQueryFacetsResponse'
    RefinedQueryListPostBody:
      title: RefinedQueryListPostBody
      type: object
      properties:
        slot_rules:
          title: Slot Rules
          description: The slotting rules attached to the refined query
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/SlotRuleBase'
        whitelist_rule:
          title: Whitelist Rule
          description: The whitelist rule attached to the refined query
          oneOf:
          - $ref: '#/components/schemas/WhitelistRuleBase'
          - type: 'null'
        blacklist_rules:
          title: Blacklist Rules
          description: The blacklist rules attached to the refined query
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/BlacklistRuleBase'
        boost_rules:
          title: Boost Rules
          description: The boost rules attached to the refined query. It is allowed to create maximum 50 manual and 50 automatic rules. The number of rules for each of the types includes both active and inactive rules
          type: array
          items:
            $ref: '#/components/schemas/BoostRuleBase'
        content_rules:
          title: Content Rules
          description: The content rules attached to the refined query
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/ContentRuleBase'
        variation_slicing_rule:
          title: Variation Slicing Rule
          description: The variation slicing rule attached to the refined query
          oneOf:
          - $ref: '#/components/schemas/VariationSlicingRuleBase'
          - type: 'null'
        filters_slot_rules:
          title: Filters Slot Rules
          description: The filters slot rules attached to the refined query
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/FiltersSlotRuleBase'
        face_out_variation_rules:
          title: Face Out Variation Rules
          description: The face out variation rules attached to the refined query.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/FaceOutVariationRuleBase'
        query:
          title: Query
          examples:
          - shoes
          - running sneakers
          minLength: 1
          maxLength: 100
          type: string
        allow_automatic_rules:
          title: Allow Automatic Rules
          description: Specifies whether to allow automatic creation of rules
          examples:
          - true
          - false
          type: boolean
        last_reviewed_at:
          title: Last Reviewed At
          description: The date of the last review
          examples:
          - '2024-03-06T16:05:19'
          type: string
          format: date-time
        last_reviewed_by:
          title: Last Reviewed By
          description: The user who last reviewed the refined query
          examples:
          - user@example.com
          type: string
        next_review_at:
          title: Next Review At
          description: The date of the next review
          examples:
          - '2024-04-06T16:05:19'
          type: string
          format: date-time
      required:
      - query
      additionalProperties: false
    RefinedQueryPutResponse:
      title: RefinedQueryPutResponse
      anyOf:
      - $ref: '#/components/schemas/RefinedQueryResultsResponse'
      - $ref: '#/components/schemas/RefinedQueryFacetsResponse'
    RefinedQueryResponse:
      title: RefinedQueryResponse
      anyOf:
      - $ref: '#/components/schemas/RefinedQueryResultsResponse'
      - $ref: '#/components/schemas/RefinedQueryFacetsResponse'
    FaceOutVariationRuleResponse:
      title: FaceOutVariationRuleResponse
      type: object
      properties:
        id:
          title: Id
          description: The ID of the rule, must be unique.
          type: integer
        request_tag_name:
          description: Request tag name to be used to activate this entity for, used only with `request_tag_value`.
          examples:
          - user_segment
          - geo_country
          allOf:
          - $ref: '#/components/schemas/RequestTags'
        request_tag_value:
          title: Request Tag Value
          description: Request tag value to be used to activate this entity for, used only with request_tag_name.
          maxLength: 100
          minLength: 1
          examples:
          - premium
          - US
          type: string
        active:
          title: Active
          description: Indicates whether this rule is active or not.
          examples:
          - true
          - false
          type: boolean
        start_time:
          title: Start Time
          description: Date and time when the rule should be enabled.
          examples:
          - '2024-03-06T16:05:19'
          type: string
          format: date-time
        end_time:
          title: End Time
          description: Date and time when the rule should be disabled.
          examples:
          - '2024-03-06T17:05:19'
          type: string
          format: date-time
        campaign_id:
          title: Campaign Id
          examples:
          - 1
          - 42
          type: integer
        automatically_generated:
          title: Automatically Generated
          description: Boolean to indicate if this rule is automatically generated or not.
          examples:
          - false
          - true
          type: boolean
