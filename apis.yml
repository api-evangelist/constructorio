aid: constructorio
name: Constructor.io
description: Constructor (Constructor.io) is an AI-powered ecommerce search and product
  discovery platform for online retailers. Its APIs cover autocomplete/autosuggest,
  keyword and natural-language search, image search, category browse, recommendations,
  quizzes, collections, offsite/email discovery, retail media (sponsored listings and
  display ads), an AI Shopping Agent and Product Insights Agent, plus a full catalog-management
  and configuration surface for items, variations, item groups, facets, searchabilities,
  synonyms, sort options, redirects and searchandising rules. Results are optimized
  against ecommerce KPIs (conversion, revenue per visit) using natural-language processing,
  behavioral re-ranking and per-user personalization, and are delivered through a REST
  API served from the ac.cnstrc.com family of hosts with first-party client libraries
  for JavaScript, Node.js, Python, Java, .NET, Ruby, Swift and Kotlin.
