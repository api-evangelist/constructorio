docs: https://docs.constructor.com/docs/make-us-prove-it-product-catalog-catalog-data-concepts
summary: >-
  Constructor's model has three layers. The CATALOG layer is the customer's product
  data (items, variations, item groups) scoped to an index. The CONFIGURATION layer
  shapes how that catalog is queried and rendered (facets, facet options,
  searchabilities, synonyms, sort options, redirect rules, collections, quizzes,
  metadata overrides). The MERCHANDISING layer (searchandising) layers rules and
  campaigns on top of both. Everything is addressed inside an index selected by the
  `key` query parameter, so `index` is the implicit root of every relationship below.

root:
  entity: Index
  addressed_by: '`key` query parameter (the public API key)'
  note: >-
    An index is not a REST resource — it has no CRUD endpoints in the public contract.
    It is selected on every request and every other entity below belongs to exactly
    one index. An account may hold many indexes (dev / staging / prod, or one per site).

