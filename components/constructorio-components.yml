storefront_cartridges_and_connectors:
  note: >-
    Distinct from the React libraries above — these are platform-native frontend
    integrations documented under Platform connectors.
  surfaces: [Salesforce B2C Commerce cartridge (SFRA and Site Genesis), BigCommerce
      Stencil, Vue Storefront, Shopify UI]
  docs: https://docs.constructor.com/docs/integrating-with-constructor-platform-connectors
